name: Signing smoke tests
on: [push, pull_request, workflow_dispatch]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select OpenSSL on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Native Python CLI
        run: python tests/smoke.py --backend python
      - name: Linux and macOS shell launcher
        if: runner.os != 'Windows'
        run: python tests/smoke.py --backend shell
      - name: Windows PowerShell CLI
        if: runner.os == 'Windows'
        run: python tests/smoke.py --backend powershell
        env:
          SIGNAPK_POWERSHELL: powershell.exe
      - name: Windows install and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          try {
            foreach ($extension in '.apk', '.zip') {
              $key = "HKCU:\Software\Classes\SystemFileAssociations\$extension\shell\SignapkTools\command"
              $expected = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "{0}\SignapkTools\Sign.ps1" -Pause "%1"' -f $env:LOCALAPPDATA
              if ((Get-Item -LiteralPath $key).GetValue('') -ne $expected) { throw 'Incorrect command' }
            }
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Uninstall.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Uninstall failed' }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Uninstall.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Repeated uninstall failed' }
          foreach ($extension in '.apk', '.zip') {
            if (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\$extension\shell\SignapkTools") { throw 'Menu remains' }
          }
